<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Astutely — formerly AY Studio</title>
<meta name="description" content="AY Studio is now Astutely. Sharp thinking, beautifully applied. Move to draw, click to sign." />
<meta name="theme-color" content="#3cff93" />

<meta property="og:title" content="Astutely — formerly AY Studio" />
<meta property="og:description" content="Sharp thinking, beautifully applied." />
<meta property="og:type" content="website" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#0d0c29;
    --ink-2:#161538;
    --paper:#f4f2eb;
    --vis:#3cff93;
    --vis-d:#22dd75;
    --vis-l:#9bffc8;          /* lighter green tint for halos on green */
    --line:rgba(13,12,41,.18);
    --line-2:rgba(13,12,41,.38);
    --mute:rgba(13,12,41,.55);
    --display:'Space Grotesk', system-ui, -apple-system, sans-serif;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --pad:clamp(20px, 4vw, 56px);
  }

  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; width:100%; overflow:hidden}
  html{-webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
  body{
    background:var(--vis);
    color:var(--ink);
    font-family:var(--display);
    font-size:16px;
    line-height:1.4;
    overscroll-behavior:none;
    touch-action:none;
    cursor:none;
  }
  ::selection{background:var(--ink); color:var(--vis)}
  a{color:inherit; text-decoration:none}
  button{font:inherit; color:inherit; background:none; border:0; cursor:none}

  /* Stage */
  .stage{
    position:fixed; inset:0;
    width:100vw; height:100vh; height:100dvh;
    overflow:hidden;
    background:
      radial-gradient(circle at 78% 28%, rgba(255,255,255,.18), transparent 55%),
      radial-gradient(circle at 12% 82%, rgba(13,12,41,.10), transparent 60%),
      var(--vis);
  }

  /* Subtle film grain — ink dots over green */
  .grain{
    position:absolute; inset:-50%;
    background-image:
      repeating-radial-gradient(circle at 0 0, rgba(13,12,41,.06) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply;
    pointer-events:none;
    animation:grainShift 7s steps(6) infinite;
    opacity:.6;
  }
  @keyframes grainShift{
    0%   {transform:translate(0,0)}
    25%  {transform:translate(-2%,1%)}
    50%  {transform:translate(1%,-2%)}
    75%  {transform:translate(-1%,2%)}
    100% {transform:translate(0,0)}
  }

  /* Ink canvas */
  canvas#ink{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
  }

  /* Custom cursor — ink crosshair on green */
  .cursor{
    position:fixed; top:0; left:0;
    width:18px; height:18px; margin:-9px 0 0 -9px;
    pointer-events:none; z-index:80;
    transform:translate3d(-100px,-100px,0);
    transition:width .2s ease, height .2s ease, margin .2s ease;
  }
  .cursor::before, .cursor::after{
    content:""; position:absolute; left:50%; top:50%; background:var(--ink);
  }
  .cursor::before{ width:1px; height:14px; transform:translate(-50%,-50%) }
  .cursor::after { width:14px; height:1px; transform:translate(-50%,-50%) }
  .cursor.hot{ width:38px; height:38px; margin:-19px 0 0 -19px }
  .cursor.hot::before{ height:22px } .cursor.hot::after{ width:22px }

  /* HUD */
  .hud{
    position:absolute; inset:0;
    display:grid;
    grid-template-rows:1fr auto;
    padding:var(--pad);
    z-index:10;
    pointer-events:none;
  }
  .hud > *{ pointer-events:auto }

  .top{
    display:flex; align-items:center; justify-content:space-between;
    gap:24px;
  }
  .brand{
    display:inline-block; line-height:0;
  }
  .brand-logo{ width:108px; height:auto; display:block }
  .brand-logo svg{ width:100%; height:auto; display:block; overflow:visible }
  .brand-logo svg path{ fill:#fff }
  @keyframes blink{ 0%,100%{opacity:1} 50%{opacity:.5} }

  /* Centerpiece */
  .center{
    align-self:center; justify-self:center;
    text-align:center;
    width:100%;
    transform:translateZ(0);
    will-change:transform;
  }
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.32em; text-transform:uppercase;
    color:var(--mute); margin-bottom:clamp(20px,3vw,32px);
    display:inline-flex; align-items:center; gap:14px;
  }
  .eyebrow .bar{ width:36px; height:1px; background:var(--line-2) }

  .wordmark{
    display:inline-block; position:relative;
    width:clamp(240px, 68vw, 880px);
    max-width:100%;
    line-height:0;
    transition:transform .25s cubic-bezier(.2,.7,.2,1);
    will-change:transform;
  }
  .wordmark svg{
    width:100%; height:auto; display:block;
    overflow:visible;
  }
  .wordmark svg path{
    fill:var(--ink);
    transition:fill .3s ease;
  }

  .tagline{
    margin-top:clamp(18px,2.4vw,28px);
    font-size:clamp(16px, 1.5vw, 20px);
    color:var(--ink);
    font-weight:500;
    letter-spacing:-.005em;
  }
  .tagline em{ font-style:normal; color:var(--ink); font-weight:500 }

  .rebrand{
    margin-top:clamp(20px,2.6vw,32px);
    font-family:var(--mono); font-size:12px; letter-spacing:.24em; text-transform:uppercase;
    color:var(--ink);
    display:inline-flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:center;
  }
  .rebrand .rb-sep{ color:var(--ink) }
  .rebrand .rb-tag{ color:var(--ink); font-weight:500 }

  /* Bottom row */
  .bottom{
    display:grid;
    grid-template-columns:1fr auto;
    align-items:center;
    gap:24px;
  }
  .meta{
    font-family:var(--display); font-size:14px; font-weight:400; letter-spacing:0;
    color:var(--ink-2);
    display:flex; gap:14px; align-items:center; justify-self:start; flex-wrap:wrap;
  }
  .meta a{ color:var(--ink); transition:color .2s ease; border-bottom:1px solid var(--ink); padding-bottom:1px }
  .meta a:hover{ color:var(--ink); border-bottom-color:transparent }
  .meta .sep{ width:14px; height:1px; background:var(--line-2); display:inline-block }

  .actions{ display:flex; gap:10px; align-items:center; justify-self:end }
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    padding:10px 16px;
    border:1px solid var(--ink);
    color:var(--ink);
    font-family:var(--display); font-size:13px; font-weight:500; letter-spacing:.01em;
    transition:border-color .2s ease, color .2s ease, background .2s ease;
    border-radius:2px;
    background:transparent;
  }
  .btn:hover{ background:rgba(13,12,41,.08) }
  .btn.primary{ border-color:var(--ink); color:var(--vis); background:var(--ink) }
  .btn.primary:hover{ background:var(--ink-2); border-color:var(--ink-2) }
  .btn .k{ color:inherit; opacity:.6 }
  .btn .ok{ color:inherit }

  /* Hint */
  .hint{
    position:absolute; left:50%; bottom:calc(var(--pad) + 60px);
    transform:translateX(-50%);
    font-family:var(--mono); font-size:10px; letter-spacing:.32em; text-transform:uppercase;
    color:var(--mute);
    display:inline-flex; align-items:center; gap:14px;
    opacity:0; transition:opacity .6s ease;
    pointer-events:none;
    white-space:nowrap;
  }
  .hint.show{ opacity:1 }
  .hint .bar{ width:24px; height:1px; background:var(--line-2) }
  .hint kbd{
    font-family:var(--mono); font-size:10px;
    border:1px solid var(--line-2); padding:3px 7px; color:var(--ink);
    border-radius:2px; line-height:1;
  }

  /* Toast */
  .toast{
    position:absolute; left:50%; top:calc(var(--pad) + 64px);
    transform:translate(-50%, -10px);
    font-family:var(--mono); font-size:10px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--vis);
    background:var(--ink);
    padding:10px 14px; border-radius:2px;
    opacity:0;
    transition:opacity .3s ease, transform .3s ease;
    pointer-events:none;
    z-index:90;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0) }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce){
    .grain, .brand .pip, .status .dot{ animation:none }
    .wordmark{ transition:none }
  }

  /* Mobile */
  @media (max-width: 720px){
    body{ cursor:auto }
    .cursor{ display:none }
    .stage{ cursor:auto }
    button, a{ cursor:pointer }
    .top{ align-items:flex-start }
    .bottom{ grid-template-columns:1fr; gap:16px; text-align:center }
    .meta{ flex-wrap:wrap; gap:10px; justify-self:center; justify-content:center }
    .meta .sep{ display:none }
    .actions{ justify-self:center; justify-content:center }
    .hint{ bottom:calc(var(--pad) + 130px); font-size:9px; letter-spacing:.22em }
    .eyebrow{ font-size:10px; letter-spacing:.22em }
    .tagline{ font-size:14px }
  }
</style>
</head>

<script>
(() => {
  const canvas = document.getElementById('ink');
  const ctx = canvas.getContext('2d', { alpha:true });
  const cursor = document.getElementById('cursor');
  const hint = document.getElementById('hint');
  const toast = document.getElementById('toast');
  const wordmark = document.getElementById('wordmark');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth = window.innerWidth;
    H = canvas.clientHeight = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener('resize', resize);

  // Trail state
  const trail = [];      // recent points for ribbon
  const sparks = [];     // signature ripples / particles
  let last = null;
  let lastMove = performance.now();
  let mouseX = W/2, mouseY = H/2;
  let hasInteracted = false;

  // Line tapers over time as the user moves — finer with cumulative motion
  const TAPER_TARGET = 6000;     // px of cumulative motion to reach minimum line width
  let totalDist = 0;
  let sharpness = 0;             // 0 → 1, drives line width

  function addPoint(x, y, pressure=1){
    const now = performance.now();
    let dist = 0;
    if (last){
      dist = Math.hypot(x-last.x, y-last.y);
      totalDist += dist;
    }
    const v = last ? dist / Math.max(1, now-last.t) : 0;
    trail.push({ x, y, t: now, v, p: pressure });
    if (trail.length > 260) trail.shift();
    last = { x, y, t: now };
    lastMove = now;
    return dist;
  }

  function signature(x, y){
    // A single editorial registration mark — precise, restrained, on-brand
    sparks.push({ kind:'reg', x, y, t: performance.now(), life: 1400 });
  }

  // Pointer
  function onPointerMove(e){
    const x = e.clientX, y = e.clientY;
    mouseX = x; mouseY = y;
    cursor.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    addPoint(x, y, e.pressure || 1);

    // Line tapers with cumulative motion — drives width in the trail render
    sharpness = Math.min(1, totalDist / TAPER_TARGET);

    if (!hasInteracted){
      hasInteracted = true;
      hint.classList.remove('show');
    }
  }
  function onPointerDown(){
    cursor.classList.add('hot');
  }
  function onPointerUp(){ cursor.classList.remove('hot'); }
  function onPointerLeave(){
    cursor.style.transform = `translate3d(-100px,-100px,0)`;
    last = null;
  }

  window.addEventListener('pointermove', onPointerMove, { passive:true });
  window.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);
  document.addEventListener('mouseleave', onPointerLeave);

  // Wordmark parallax — subtle whole-mark drift toward the cursor
  function updateWordmark(){
    if (reduceMotion) return;
    const cx = W/2, cy = H/2;
    const dx = (mouseX - cx) / W;   // -0.5 .. 0.5
    const dy = (mouseY - cy) / H;
    const tx = dx * 14;
    const ty = dy * 8;
    wordmark.style.transform = `translate3d(${tx.toFixed(2)}px, ${ty.toFixed(2)}px, 0)`;
  }

  // Render loop
  function frame(){
    const now = performance.now();

    // fade existing canvas — gives a graceful trail
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(13,12,41,0.06)';
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = 'source-over';

    // draw trail as smooth glowing line
    if (trail.length > 1){
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Outer ink shadow — scales with sharpness for an overall taper
      const glowW = 20 * (1 - sharpness) + 2 * sharpness;   // 20 → 2
      const glowA = 0.07 * (1 - sharpness) + 0.02 * sharpness;
      ctx.strokeStyle = `rgba(13,12,41,${glowA.toFixed(3)})`;
      ctx.lineWidth = glowW;
      ctx.beginPath();
      ctx.moveTo(trail[0].x, trail[0].y);
      for (let i=1; i<trail.length; i++){
        const p = trail[i];
        ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();

      // Crisp ink core — starts thick, ends at ~1px
      const sharpW = 0.65;
      const bluntW = 7.5;
      const baseW = bluntW * (1 - sharpness) + sharpW * sharpness;

      for (let i=1; i<trail.length; i++){
        const p0 = trail[i-1], p1 = trail[i];
        const age = (now - p1.t) / 2200;          // 0..1+
        if (age > 1) continue;
        const a = 1 - age;
        const speedTaper = Math.max(0.25, 1 - Math.min(1, p1.v * 0.06));
        const w = baseW * a * speedTaper + 0.35;
        const alpha = (0.7 + 0.25 * sharpness) * a;
        ctx.strokeStyle = `rgba(13,12,41,${alpha.toFixed(3)})`;
        ctx.lineWidth = w;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.stroke();
      }

      // expire old points
      while (trail.length && now - trail[0].t > 2200) trail.shift();
    }

    // sparks / signatures — editorial registration mark
    for (let i = sparks.length - 1; i >= 0; i--){
      const s = sparks[i];
      const age = now - s.t;
      if (age > s.life){ sparks.splice(i,1); continue; }
      const k = age / s.life;
      let a;
      if (k < 0.18)      a = k / 0.18;
      else if (k < 0.55) a = 1;
      else               a = 1 - (k - 0.55) / 0.45;

      if (s.kind === 'reg'){
        ctx.strokeStyle = `rgba(13,12,41,${(0.85*a).toFixed(3)})`;
        ctx.lineWidth = 1;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(s.x, s.y, 14, 0, Math.PI*2);
        ctx.stroke();
        const len = 22, gap = 6;
        ctx.beginPath();
        ctx.moveTo(s.x - len, s.y); ctx.lineTo(s.x - gap, s.y);
        ctx.moveTo(s.x + gap, s.y); ctx.lineTo(s.x + len, s.y);
        ctx.moveTo(s.x, s.y - len); ctx.lineTo(s.x, s.y - gap);
        ctx.moveTo(s.x, s.y + gap); ctx.lineTo(s.x, s.y + len);
        ctx.stroke();
      }
    }

    updateWordmark();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Hint timing — show after a beat, hide on first interaction
  setTimeout(() => { if (!hasInteracted) hint.classList.add('show'); }, 700);
  setTimeout(() => { hint.classList.remove('show'); }, 9000);

  // Clear button + 'C' key
  function clearAll(){
    trail.length = 0;
    sparks.length = 0;
    ctx.clearRect(0,0,W,H);
    // Line-taper progress persists through Clear — the journey isn't undone.
  }
  document.getElementById('clearBtn').addEventListener('click', clearAll);
  window.addEventListener('keydown', (e) => {
    if (e.key === 'c' || e.key === 'C') clearAll();
  });

  // Share
  const shareBtn = document.getElementById('shareBtn');
  shareBtn.addEventListener('click', async () => {
    const url = window.location.href;
    const data = {
      title: 'Astutely — formerly AY Studio',
      text: 'Sharp thinking, beautifully applied.',
      url
    };
    try {
      if (navigator.share && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)){
        await navigator.share(data);
        return;
      }
      await navigator.clipboard.writeText(url);
      toast.textContent = 'Link copied';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1600);
    } catch (err) {
      toast.textContent = 'Copy failed';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1600);
    }
  });
})();
</script>
</body>
</html>
